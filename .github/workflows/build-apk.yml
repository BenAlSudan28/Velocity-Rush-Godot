name: Build Velocity Rush 3D APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      # 1. Download repository
      - name: Checkout project
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Configure Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      # 4. Install required SDK packages
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Verify Android SDK and Java
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "Android SDK: $ANDROID_HOME"
          echo "Java SDK: $JAVA_HOME"

          test -d "$ANDROID_HOME/platform-tools"
          test -f "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -f "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -d "$JAVA_HOME"

          echo "Android SDK and Java checks passed."

      # 6. Download Godot 4.4.1
      - name: Download Godot
        shell: bash
        run: |
          set -e

          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip" \
            -O godot.zip

          unzip -q godot.zip -d godot-bin

          chmod +x \
            godot-bin/Godot_v4.4.1-stable_linux.x86_64

      # 7. Install matching export templates
      - name: Install Godot export templates
        shell: bash
        run: |
          set -e

          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" \
            -O godot-templates.tpz

          mkdir -p /tmp/godot-templates

          unzip -q \
            godot-templates.tpz \
            -d /tmp/godot-templates

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.4.1.stable"

          mkdir -p "$TEMPLATE_DIR"

          cp -a \
            /tmp/godot-templates/templates/. \
            "$TEMPLATE_DIR/"

          test -f "$TEMPLATE_DIR/android_debug.apk"
          test -f "$TEMPLATE_DIR/android_release.apk"

          echo "Godot Android export templates installed."

      # 8. Create Android debug keystore
      - name: Create Android debug keystore
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.android"

          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storetype JKS \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          test -s "$HOME/.android/debug.keystore"

      # 9. Configure Godot 4.4 settings
      - name: Configure Godot Android paths
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.config/godot"

          # IMPORTANT:
          # Godot 4.4.1 reads editor_settings-4.4.tres.
          # Do not use editor_settings-4.tres here.

          SETTINGS="$HOME/.config/godot/editor_settings-4.4.tres"

          cat > "$SETTINGS" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          echo "Created Godot settings file:"
          echo "$SETTINGS"

          echo "========== SETTINGS CONTENTS =========="
          cat "$SETTINGS"

          test -s "$SETTINGS"

      # 10. Check export preset
      - name: Verify Android export preset
        shell: bash
        run: |
          set -e

          if [ ! -f "export_presets.cfg" ]; then
            echo "ERROR: export_presets.cfg was not found."
            exit 1
          fi

          if ! grep -Fq 'platform="Android"' export_presets.cfg; then
            echo "ERROR: Android export preset is missing."
            exit 1
          fi

          if ! grep -Fq 'name="Android"' export_presets.cfg; then
            echo "ERROR: Export preset name must be Android."
            exit 1
          fi

          echo "========== ANDROID EXPORT PRESET =========="
          cat export_presets.cfg

      # 11. Import and validate Godot project
      - name: Validate Godot project
        shell: bash
        run: |
          set -e

          GODOT="./godot-bin/Godot_v4.4.1-stable_linux.x86_64"

          "$GODOT" \
            --headless \
            --editor \
            --path . \
            --quit

      # 12. Export APK
      - name: Export Android APK
        shell: bash
        run: |
          set -o pipefail

          GODOT="./godot-bin/Godot_v4.4.1-stable_linux.x86_64"

          mkdir -p build

          "$GODOT" \
            --headless \
            --path . \
            --verbose \
            --export-debug \
            "Android" \
            "build/VelocityRush3D.apk" \
            2>&1 | tee build/export-log.txt

      # 13. Upload export log for diagnosis
      - name: Upload build diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Velocity-Rush-Build-Logs
          path: build/export-log.txt
          if-no-files-found: ignore
          retention-days: 7

      # 14. Verify APK
      - name: Verify APK
        if: success()
        shell: bash
        run: |
          set -e

          if [ ! -s "build/VelocityRush3D.apk" ]; then
            echo "ERROR: APK file is missing or empty."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh build/VelocityRush3D.apk

      # 15. Upload APK
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Velocity-Rush-3D-APK
          path: build/VelocityRush3D.apk
          if-no-files-found: error
          retention-days: 7
