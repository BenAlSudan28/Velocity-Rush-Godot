name: Build Velocity Rush 3D APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: |
          set -e

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Download Godot 4.4.1
        run: |
          set -e

          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip" \
            -O godot.zip

          unzip -q godot.zip -d godot-bin

          chmod +x godot-bin/Godot_v4.4.1-stable_linux.x86_64

      - name: Install Godot export templates
        run: |
          set -e

          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" \
            -O godot-templates.tpz

          mkdir -p /tmp/godot-templates

          unzip -q godot-templates.tpz -d /tmp/godot-templates

          mkdir -p \
            "$HOME/.local/share/godot/export_templates/4.4.1.stable"

          cp -a \
            /tmp/godot-templates/templates/. \
            "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Create Android debug keystore
        run: |
          set -e

          mkdir -p "$HOME/.android"

          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Configure Godot Android paths
        run: |
          set -e

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Validate Godot project
        run: |
          set -e

          GODOT="./godot-bin/Godot_v4.4.1-stable_linux.x86_64"

          "$GODOT" --headless --editor --path . --quit

      - name: Inspect Android export preset
        run: |
          set -e

          echo "========== export_presets.cfg =========="

          if [ -f export_presets.cfg ]; then
            cat export_presets.cfg
          else
            echo "ERROR: export_presets.cfg is missing"
            exit 1
          fi

          echo "========== Available export platforms =========="

          ./godot-bin/Godot_v4.4.1-stable_linux.x86_64 \
            --headless \
            --path . \
            --editor \
            --quit \
            --verbose

      - name: Export Android APK with detailed logging
        run: |
          set -o pipefail

          GODOT="./godot-bin/Godot_v4.4.1-stable_linux.x86_64"

          mkdir -p build

          "$GODOT" \
            --headless \
            --path . \
            --verbose \
            --export-debug \
            "Android" \
            "build/VelocityRush3D.apk" \
            2>&1 | tee build/export-log.txt

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Velocity-Rush-Build-Logs
          path: build/export-log.txt
          if-no-files-found: ignore

      - name: Verify APK
        if: success()
        run: |
          set -e

          test -s build/VelocityRush3D.apk

          ls -lh build/VelocityRush3D.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Velocity-Rush-3D-APK
          path: build/VelocityRush3D.apk
          if-no-files-found: error
          retention-days: 7
