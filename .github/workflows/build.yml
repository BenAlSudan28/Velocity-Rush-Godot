name: Build Velocity Rush 3D APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Export Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Download Godot 4.4.1
        run: |
          wget -q \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip \
            -O godot.zip

          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.4.1-stable_linux.x86_64

      - name: Install matching Android export templates
        run: |
          wget -q \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz \
            -O godot-templates.tpz

          mkdir -p /tmp/godot-templates
          unzip -q godot-templates.tpz -d /tmp/godot-templates

          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"

          cp -a \
            /tmp/godot-templates/templates/. \
            "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Create Android debug keystore
        run: |
          mkdir -p "$HOME/.android"

          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Configure Godot Android paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Check Godot project
        run: |
          GODOT="./godot-bin/Godot_v4.4.1-stable_linux.x86_64"

          "$GODOT" --headless --path . --editor --quit

      - name: Export Android APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          GODOT="./godot-bin/Godot_v4.4.1-stable_linux.x86_64"

          mkdir -p build

          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"

          "$GODOT" \
            --headless \
            --path . \
            --export-debug "Android" build/VelocityRush3D.apk

      - name: Verify APK
        run: |
          test -s build/VelocityRush3D.apk
          ls -lh build/VelocityRush3D.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Velocity-Rush-3D-APK
          path: build/VelocityRush3D.apk
          if-no-files-found: error
